[package]
name = "xray-translation"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "from_str"] }
log = "0.4.33"
quick-xml = { version = "0.41.0", features = ["serialize", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
xray-error = { path = "../xray-error" }
xray-output = { path = "../xray-output" }
xray-report = { path = "../xray-report" }
xray-utils = { path = "../xray-utils" }

[dev-dependencies]
xray-test-utils = { path = "../xray-test-utils" }

[lints]
workspace = true
