[package]
name = "xrf-archive"
version = "0.1.0"
publish = false
edition = "2024"
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bounded_join_set = "0.3.0"
byteorder = { workspace = true }
crc32fast = "1.5.0"
delharc = { workspace = true, features = ["std", "lh1"] }
log = { workspace = true }
minilzo-rs = "0.6.1"
regex = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
walkdir = { workspace = true }
xrf-error = { workspace = true }
xrf-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["ts-rs"]

[lints]
workspace = true
