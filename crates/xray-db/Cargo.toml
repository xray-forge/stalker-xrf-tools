[package]
name = "xray-db"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
byteorder = { workspace = true }
derive_more = { workspace = true, features = ["display", "from_str"] }
enum-map = "3.1.0"
lazy_static = "1.5.0"
log = { workspace = true }
phf = { version = "0.14.0", features = ["macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, features = ["uuid-impl"], optional = true }
uuid = { workspace = true, features = ["v4", "serde"] }
xray-chunk = { workspace = true }
xray-error = { workspace = true }
xray-ltx = { workspace = true }
xray-utils = { workspace = true }

[features]
# Emits TypeScript mirrors of the serialized types. Nothing in a normal build turns this on.
typescript-bindings = ["ts-rs"]

[dev-dependencies]
xray-test-utils = { workspace = true }

[lints]
workspace = true
