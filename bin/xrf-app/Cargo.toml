[package]
name = "xrf-app"
version = "0.1.0"
description = "XRF development tools"
authors = ["Neloreck"]
edition = "2024"
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [
    "codegen"
] }

[dependencies]
env_logger = { workspace = true }
log = { workspace = true }
percent-encoding = "2.3.2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
xray-archive = { workspace = true }
xray-db = { workspace = true }
xray-export = { workspace = true }
xray-ltx = { workspace = true }
xray-output = { workspace = true }
xray-sound = { workspace = true }
xray-texture = { workspace = true }
xray-utils = { workspace = true }
xray-translation = { workspace = true }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
