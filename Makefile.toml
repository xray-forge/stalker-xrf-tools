[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.test]

[tasks.doc]

[tasks.format]
description = "Format rust codebase."
command = "cargo"
args = ["fmt"]

[tasks.format-check]
description = "Check format of rust codebase."
workspace = false
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.lint]
description = "Lint rust codebase with clippy tool."
workspace = false
command = "cargo"
args = ["clippy"]

[tasks.build-cli]
description = "Build CLI application in debug mode."
workspace = false
dependencies = [
  { name = "build", path = "bin/xrf-cli" },
]

[tasks.build-cli-release]
description = "Build CLI application in release mode."
workspace = false
dependencies = [
  { name = "build-release", path = "bin/xrf-cli" },
]

[tasks.build-app]
description = "Build UI application in debug mode."
workspace = false
dependencies = [
  { name = "build", path = "bin/xrf-app" },
]

[tasks.build-app-release]
description = "Build UI application in release mode."
workspace = false
dependencies = [
  { name = "build-release", path = "bin/xrf-app" },
]

[tasks.dev-app]
description = "Run UI application backend and frontend in watch mode."
workspace = false
dependencies = [
  { name = "dev", path = "bin/xrf-app" },
]

[tasks.serve-backend]
description = "Run UI application backend in watch mode."
workspace = false
dependencies = [
  { name = "serve-backend", path = "bin/xrf-app" },
]

[tasks.serve-ui]
description = "Run UI application frontend in watch mode."
workspace = false
dependencies = [
  { name = "serve-ui", path = "bin/xrf-app" },
]

[tasks.generate-typescript-bindings]
description = "Emit the frontend mirrors of serialized Rust types."
workspace = false
# The export directory is resolved against the crate manifest directory, so it is the same string
# wherever the task runs from. Wide integers become `number` rather than the default `bigint`: these
# cross a JSON transport, so that is what the frontend actually receives.
env = { TS_RS_EXPORT_DIR = "../../bin/xrf-ui/src/lib/xrf/bindings", TS_RS_LARGE_INT = "number" }
command = "cargo"
# One run over the whole workspace: each crate opts in by adding its own `typescript` feature here, and
# `#[ts(export)]` puts the emitting test in the crate that defines the type.
args = [
  "test",
  "--workspace",
  "--features",
  "xray-archive/typescript-bindings,xray-db/typescript-bindings,xray-export/typescript-bindings,xray-error/typescript-bindings,xray-ltx/typescript-bindings,xrf-app/typescript-bindings",
  "export_bindings",
]

[tasks.format-typescript-bindings]
description = "Apply frontend formatting and lint rules to generated mirrors."
workspace = false
cwd = "bin/xrf-ui"
script_runner = "@shell"
script = 'pnpm run format:bindings'

[tasks.generate-typescript]
description = "Regenerate and format the frontend mirrors of serialized Rust types."
workspace = false
dependencies = ["generate-typescript-bindings", "format-typescript-bindings"]
