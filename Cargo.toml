[workspace]
resolver = "3"
members = [
  "bin/xrf-app",
  "bin/xrf-cli",
  "crates/xrf-archive",
  "crates/xrf-assets",
  "crates/xrf-chunk",
  "crates/xrf-db",
  "crates/xrf-error",
  "crates/xrf-error-derive",
  "crates/xrf-export",
  "crates/xrf-gamedata",
  "crates/xrf-ltx",
  "crates/xrf-lua",
  "crates/xrf-output",
  "crates/xrf-report",
  "crates/xrf-shaders",
  "crates/xrf-sound",
  "crates/xrf-test-utils",
  "crates/xrf-texture",
  "crates/xrf-typescript",
  "crates/xrf-translation",
  "crates/xrf-utils",
  "crates/xrf-xml",
  "vendor/delharc",
]

[workspace.package]
rust-version = "1.97.1"

[workspace.dependencies]
byteorder = "1.5.0"
ddsfile = "0.5.2"
delharc = { path = "vendor/delharc" }
derive_more = "2.1.1"
env_logger = "0.11.11"
fileslice = { version = "0.7.0", default-features = false }
image = { version = "0.25.10", default-features = false }
log = "0.4.33"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = "12.0.1"
uuid = "1.24.0"
walkdir = "2.5.0"
xrf-archive = { path = "crates/xrf-archive" }
xrf-assets = { path = "crates/xrf-assets" }
xrf-chunk = { path = "crates/xrf-chunk" }
xrf-db = { path = "crates/xrf-db" }
xrf-error = { path = "crates/xrf-error" }
xrf-error-derive = { path = "crates/xrf-error-derive" }
xrf-export = { path = "crates/xrf-export" }
xrf-gamedata = { path = "crates/xrf-gamedata" }
xrf-ltx = { path = "crates/xrf-ltx" }
xrf-lua = { path = "crates/xrf-lua" }
xrf-output = { path = "crates/xrf-output" }
xrf-report = { path = "crates/xrf-report" }
xrf-shaders = { path = "crates/xrf-shaders" }
xrf-sound = { path = "crates/xrf-sound" }
xrf-test-utils = { path = "crates/xrf-test-utils" }
xrf-texture = { path = "crates/xrf-texture" }
xrf-translation = { path = "crates/xrf-translation" }
xrf-typescript = { path = "crates/xrf-typescript" }
xrf-utils = { path = "crates/xrf-utils" }
xrf-xml = { path = "crates/xrf-xml" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[workspace.lints.rust]
dead_code = "allow"

[workspace.lints.clippy]
extra_unused_type_parameters = "allow"
doc_lazy_continuation = "allow"
module_inception = "allow"
